<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="SEOForge workflow: scope, collect evidence, diagnose, prioritise, implement and verify"><rect width="1200" height="300" rx="26" fill="#f2f7fc"/><text x="45" y="56" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#15324e">How SEOForge works</text><g font-family="Arial,sans-serif" text-anchor="middle" font-size="18" font-weight="bold"><rect x="44" y="112" width="164" height="94" rx="19" fill="#102d4e"/><text x="126" y="167" fill="white">Scope</text><path d="M215 159h12" stroke="#3298aa" stroke-width="4"/><path d="m224 152 9 7-9 7" fill="none" stroke="#3298aa" stroke-width="4"/><rect x="235" y="112" width="164" height="94" rx="19" fill="#184568"/><text x="317" y="167" fill="white">Collect</text><path d="M406 159h12" stroke="#3298aa" stroke-width="4"/><path d="m415 152 9 7-9 7" fill="none" stroke="#3298aa" stroke-width="4"/><rect x="426" y="112" width="164" height="94" rx="19" fill="#1d6582"/><text x="508" y="167" fill="white">Diagnose</text><path d="M597 159h12" stroke="#3298aa" stroke-width="4"/><path d="m606 152 9 7-9 7" fill="none" stroke="#3298aa" stroke-width="4"/><rect x="617" y="112" width="164" height="94" rx="19" fill="#207d89"/><text x="699" y="167" fill="white">Prioritise</text><path d="M788 159h12" stroke="#3298aa" stroke-width="4"/><path d="m797 152 9 7-9 7" fill="none" stroke="#3298aa" stroke-width="4"/><rect x="808" y="112" width="164" height="94" rx="19" fill="#188c83"/><text x="890" y="167" fill="white">Implement</text><path d="M979 159h12" stroke="#3298aa" stroke-width="4"/><path d="m988 152 9 7-9 7" fill="none" stroke="#3298aa" stroke-width="4"/><rect x="999" y="112" width="164" height="94" rx="19" fill="#116960"/><text x="1081" y="167" fill="white">Verify</text></g><text x="45" y="256" font-family="Arial,sans-serif" font-size="18" fill="#46627d">Every finding includes a source, confidence, next step and a way to check the result.</text></svg>